name: build

on:
  push:
    branches: [ main, master, dual-layer-port ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCOPY_PLUGIN_AFTER_BUILD=FALSE
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The version comes from CMakeLists.txt, not from the ref: it goes inside
      # the pkg, where macOS uses it to tell an upgrade from a fresh install,
      # and a branch push would otherwise stamp the branch name in as a
      # version.  The file name carries no version at all — it is served from
      # a fixed CDN URL.
      - name: Package (unsigned)
        run: |
          ver=$(sed -n 's/^project(ferment-family VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "packaging version ${ver:?could not read version from CMakeLists.txt}"
          FERMENT_ARCH=universal bash scripts/installer_mac/make_ferment_installer.sh \
            "$ver" build dist scripts/installer_mac/resources
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=FALSE
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # No version in the name: fixed CDN URL, same as the macOS DMG.
          $out = "dist/ferment-family-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem -Recurse -Directory build/src-ferment -Filter "*.vst3" |
            Where-Object { $_.FullName -match "Release" } |
            ForEach-Object { Copy-Item -Recurse $_.FullName $out }
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-vst3
          path: dist/*.zip
